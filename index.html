<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画像まとめメーカー</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--ink:#4a3a55;--sub:#8a7a95;--pk:#ff8fc1;--lv:#b9a6ff;--line:#f0dcef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a26;--card:#2a2333;--ink:#f1e8f7;--sub:#b3a5c0;--line:#40344d}}
:root[data-theme="dark"]{--bg:#1f1a26;--card:#2a2333;--ink:#f1e8f7;--sub:#b3a5c0;--line:#40344d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:linear-gradient(135deg,var(--pk),var(--lv));color:#fff;font-weight:700}
button.sm{padding:4px 9px;font-size:13px;background:var(--line);color:var(--ink)}
button:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{width:84px;font-size:14px;color:var(--sub);flex:none}
.row input[type=range]{flex:1;accent-color:var(--pk)}
.row output{width:44px;text-align:right;font-size:14px}
select,input[type=color]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px}
#list{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.it{flex:none;width:84px;text-align:center}
.it .th{width:84px;height:84px;border-radius:12px;border:1px solid var(--line);background:repeating-conic-gradient(#0000000d 0 25%,#0000 0 50%) 0 0/14px 14px;object-fit:contain;display:block}
.it .bt{display:flex;gap:2px;justify-content:center;margin-top:4px}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.pv{overflow:auto;border-radius:12px;background:repeating-conic-gradient(#0000000d 0 25%,#0000 0 50%) 0 0/16px 16px}
canvas{display:block;max-width:100%;height:auto;margin:0 auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.meta{font-size:13px;color:var(--sub);margin:6px 0 10px}
#fb img{max-width:100%;border-radius:12px}
</style>
</head>
<body>
<main>
<h1>🐰 画像まとめメーカー</h1>

<div class="card">
  <div class="row"><button id="add">画像を選ぶ</button><button class="sm" id="clr">全部消す</button></div>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div id="list"><div class="empty">画像を選ぶと、ここに並びます（◀▶で順番を入れ替え）</div></div>
</div>

<div class="card">
  <div class="row"><label>列の数</label><input id="cols" type="range" min="1" max="10" value="4"><output id="colsO"></output></div>
  <div class="row"><label>1枚のサイズ</label><input id="cell" type="range" min="40" max="512" step="2" value="180"><output id="cellO"></output></div>
  <div class="row"><label>すき間</label><input id="gap" type="range" min="0" max="60" value="8"><output id="gapO"></output></div>
  <div class="row"><label>まわりの余白</label><input id="pad" type="range" min="0" max="60" value="8"><output id="padO"></output></div>
  <div class="row"><label>はめ方</label><select id="fit"><option value="contain">全体を表示</option><option value="cover">ぴったり切り抜き</option></select></div>
  <div class="row"><label>背景</label><select id="bgm"><option value="none">透明</option><option value="#ffffff">白</option><option value="custom">色を選ぶ</option></select><input id="bgc" type="color" value="#ffe3f1" hidden></div>
</div>

<div class="card">
  <div class="meta" id="meta">—</div>
  <div class="meta">👆 プレビューの画像を長押ししてドラッグすると、好きな位置に並べ替えできます</div>
  <div class="pv"><canvas id="cv" width="10" height="10"></canvas></div>
  <div class="row" style="margin-top:12px"><button id="save" disabled>PNGで保存</button></div>
  <div id="fb"></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let items=[],drag=null,G=null;

function load(file){return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res({im,url:u});im.onerror=()=>res(null);im.src=u})}
$('add').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  for(const f of e.target.files){const r=await load(f);if(r)items.push(r)}
  e.target.value='';sync();
};
$('clr').onclick=()=>{items=[];sync()};
