<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画像まとめメーカー</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--ink:#4a3a55;--sub:#8a7a95;--pk:#ff8fc1;--lv:#b9a6ff;--line:#f0dcef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a26;--card:#2a2333;--ink:#f1e8f7;--sub:#b3a5c0;--line:#40344d}}
:root[data-theme="dark"]{--bg:#1f1a26;--card:#2a2333;--ink:#f1e8f7;--sub:#b3a5c0;--line:#40344d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:linear-gradient(135deg,var(--pk),var(--lv));color:#fff;font-weight:700;display:inline-block;cursor:pointer}
button.sm{padding:4px 9px;font-size:13px;background:var(--line);color:var(--ink)}
button:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{width:84px;font-size:14px;color:var(--sub);flex:none}
.row label.btn{width:auto;font-size:inherit;color:#fff}
.row input[type=range]{flex:1;accent-color:var(--pk)}
.row output{width:44px;text-align:right;font-size:14px}
select,input[type=color]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px}
#list{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.it{flex:none;width:84px;text-align:center}
.it .th{width:84px;height:84px;border-radius:12px;border:1px solid var(--line);background:repeating-conic-gradient(#0000000d 0 25%,#0000 0 50%) 0 0/14px 14px;display:block}
.it .bt{display:flex;gap:2px;justify-content:center;margin-top:4px}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.pv{overflow:auto;border-radius:12px;background:repeating-conic-gradient(#0000000d 0 25%,#0000 0 50%) 0 0/16px 16px}
canvas{display:block;max-width:100%;height:auto;margin:0 auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas.th{max-width:none}
.meta{font-size:13px;color:var(--sub);margin:6px 0 10px}
#fb img{max-width:100%;border-radius:12px}
</style>
</head>
<body>
<main>
<h1>🐰 画像まとめメーカー</h1>

<div class="card">
  <div class="row"><label class="btn" for="file">画像を選ぶ</label><button class="sm" id="clr">全部消す</button></div>
  <input id="file" type="file" accept="image/*" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  <div id="list"><div class="empty">画像を選ぶと、ここに並びます（◀▶で順番を入れ替え）</div></div>
</div>

<div class="card">
  <div class="row"><label>列の数</label><input id="cols" type="range" min="1" max="10" value="4"><output id="colsO"></output></div>
  <div class="row"><label>1枚のサイズ</label><input id="cell" type="range" min="40" max="512" step="2" value="180"><output id="cellO"></output></div>
  <div class="row"><label>すき間</label><input id="gap" type="range" min="0" max="60" value="8"><output id="gapO"></output></div>
  <div class="row"><label>まわりの余白</label><input id="pad" type="range" min="0" max="60" value="8"><output id="padO"></output></div>
  <div class="row"><label>はめ方</label><select id="fit"><option value="contain">全体を表示</option><option value="cover">ぴったり切り抜き</option></select></div>
  <div class="row"><label>背景</label><select id="bgm"><option value="none">透明</option><option value="#ffffff">白</option><option value="custom">色を選ぶ</option></select><input id="bgc" type="color" value="#ffe3f1" hidden></div>
</div>

<div class="card">
  <div class="meta" id="meta">—</div>
  <div class="meta">👆 プレビューの画像を長押ししてドラッグすると、好きな位置に並べ替えできます</div>
  <div class="pv"><canvas id="cv" width="10" height="10"></canvas></div>
  <div class="row" style="margin-top:12px"><button id="save" disabled>PNGで保存</button></div>
  <div id="fb"></div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let items=[],drag=null,G=null;

// 画像を「URLなし」で読み込む（サイトのセキュリティ設定に左右されにくい）
async function load(file){
  try{const im=await createImageBitmap(file);return{im,w:im.width,h:im.height}}catch(_){}
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>res({im,w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>res(null);im.src=fr.result};
    fr.onerror=()=>res(null);fr.readAsDataURL(file);
  });
}
async function addFiles(fs){for(const f of fs){if(f.type&&!f.type.startsWith('image/'))continue;const r=await load(f);if(r)items.push(r)}sync()}
$('file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';await addFiles(fs)};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
$('clr').onclick=()=>{items=[];sync()};

['cols','cell','gap','pad','fit','bgm','bgc'].forEach(k=>$(k).oninput=draw);
$('bgm').onchange=()=>{$('bgc').hidden=$('bgm').value!=='custom';draw()};

function sync(){
  const L=$('list');L.innerHTML='';
  if(!items.length)L.innerHTML='<div class="empty">画像を選ぶと、ここに並びます（◀▶で順番を入れ替え）</div>';
  items.forEach((it,i)=>{
    const d=document.createElement('div');d.className='it';
    const th=document.createElement('canvas');th.width=th.height=168;th.className='th';
    const t=th.getContext('2d'),s=Math.min(168/it.w,168/it.h);
    t.drawImage(it.im,(168-it.w*s)/2,(168-it.h*s)/2,it.w*s,it.h*s);
    d.appendChild(th);
    const b=document.createElement('div');b.className='bt';
    [['◀',-1],['▶',1],['✕',0]].forEach(([tx,v])=>{
      const x=document.createElement('button');x.className='sm';x.textContent=tx;
      x.onclick=()=>{
        if(v===0)items.splice(i,1);
        else{const j=i+v;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]]}
        sync();
      };b.appendChild(x);
    });
    d.appendChild(b);L.appendChild(d);
  });
  draw();
}

function draw(){
  const cols=+$('cols').value,cell=+$('cell').value,gap=+$('gap').value,pad=+$('pad').value;
  $('colsO').value=cols;$('cellO').value=cell;$('gapO').value=gap;$('padO').value=pad;
  const n=items.length;$('save').disabled=!n;
  if(!n){G=null;cv.width=cv.height=10;ctx.clearRect(0,0,10,10);$('meta').textContent='まだ画像がありません';return}
  const c=Math.min(cols,n),r=Math.ceil(n/c);
  const W=pad*2+c*cell+(c-1)*gap,H=pad*2+r*cell+(r-1)*gap;
  cv.width=W;cv.height=H;G={c,cell,gap,pad,n};
  const m=$('bgm').value;
  if(m!=='none'){ctx.fillStyle=m==='custom'?$('bgc').value:m;ctx.fillRect(0,0,W,H)}
  const cover=$('fit').value==='cover';
  const paint=(it,x,y)=>{
    const w=it.w,h=it.h;
    const s=cover?Math.max(cell/w,cell/h):Math.min(cell/w,cell/h);
    const dw=w*s,dh=h*s;
    ctx.save();ctx.beginPath();ctx.rect(x,y,cell,cell);ctx.clip();
    ctx.drawImage(it.im,x+(
